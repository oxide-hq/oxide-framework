[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxide-hq/oxide-framework"

[workspace.dependencies]
# Internal crates
oxide-http = { path = "crates/oxide-http", version = "0.1.0" }
oxide-http-macros = { path = "crates/oxide-http-macros", version = "0.1.0" }
oxide-orm = { path = "crates/oxide-orm", version = "0.1.0" }
oxide-orm-macros = { path = "crates/oxide-orm-macros", version = "0.1.0" }
oxide-log = { path = "crates/oxide-log", version = "0.1.0" }
oxide-foundation = { path = "crates/oxide-foundation", version = "0.1.0" }
oxide-config = { path = "crates/oxide-config", version = "0.1.0" }
oxide-config-macros = { path = "crates/oxide-config-macros", version = "0.1.0" }
oxide-support = { path = "crates/oxide-support", version = "0.1.0" }
oxide = { path = "crates/oxide", version = "0.1.0" }

# HTTP runtime
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Serialization & validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
validator = { version = "0.21", features = ["derive"] }
thiserror = "2"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.6", features = ["derive"] }
cliclack = "0.5"
console = "0.16"
heck = "0.5"
toml = "1"
dotenvy = "0.15"

# Support helpers
uuid = { version = "1", features = ["v4", "v7"] }
ulid = "3"
getrandom = "0.4"
deunicode = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
tracing-appender = "0.2"

# Proc-macro tooling
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
# Faster incremental builds; keep full debuginfo only for our own crates.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
