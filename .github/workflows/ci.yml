name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Cursor rule matches the Claude Code skill
        run: scripts/sync-agent-rules.sh --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # .cargo/config.toml links with clang + mold.
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: oxide
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The PostgreSQL suite fails rather than skips under CI when this is missing.
      OXIDE_TEST_POSTGRES_URL: postgres://postgres:oxide@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: oxide
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OXIDE_TEST_POSTGRES_URL: postgres://postgres:oxide@localhost:5432/postgres
      # Keep in sync with `cov_ignore` in the justfile.
      COV_IGNORE: (/tests/|/templates/|oxide-umbrella-test)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Run the suite once, then report in each format from the same profile data.
      - run: cargo llvm-cov --workspace --all-features --locked --no-report
      - name: Summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
      # The gate: fail below 85% line coverage.
      - run: cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" --fail-under-lines 85

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@v1
      # Pass the version as an input: Dependabot reads a `@1.88` ref as a version to bump.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # `+1.88` overrides the stable channel pinned in rust-toolchain.toml.
      - run: cargo +1.88 check --workspace --all-targets --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Install the channel named in rust-toolchain.toml inside the action's container.
          rust-version: stable

  e2e:
    name: Scaffold e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: oxide
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OXIDE_TEST_POSTGRES_URL: postgres://postgres:oxide@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The generated apps build into target/e2e; cache it with the workspace target.
          cache-directories: target/e2e
      # Generates apps with `oxide new` and `make:*`, then runs each app's own `cargo test`.
      - run: cargo test -p oxide-cli --test bootstrapper_test --locked -- --ignored
